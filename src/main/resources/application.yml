spring:
  application:
    name: membership
  datasource:
    # In-memory H2 by default: reproducible for graders, zero setup.
    # File-mode for persistence-across-restart demo: jdbc:h2:file:./data/membership
    url: jdbc:h2:mem:membership;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # ddl-auto=update for take-home velocity. Production path: Flyway/Liquibase
      # versioned migrations (schema changes must be reviewed, not silently applied).
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Quote identifiers that are reserved SQL keywords (e.g. "value", "rank").
        auto_quote_keyword: true
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Bucket B - operational/infra knobs (restart to change). Business-tunable
# policy (fees, thresholds, grace period) lives in the DB, edited via admin APIs.
membership:
  default-currency: INR
  seed-on-startup: true
  # 02:00 on the 1st of every month
  evaluation-cron: "0 0 2 1 * *"
  # 03:00 daily — downgrade subscriptions whose grace window lapsed unpaid
  grace-sweep-cron: "0 0 3 * * *"
  # 03:30 daily — flip ACTIVE subscriptions past their expiry date to EXPIRED
  expiry-sweep-cron: "0 30 3 * * *"
  payment:
    # mock gateway: auto-approve charges so the happy path is demoable
    auto-approve: true

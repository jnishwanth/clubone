# Each test context gets its own isolated in-memory DB (random name) so parallel
# contexts can't share/close the same H2 instance. create-drop = fresh schema,
# and avoids the ddl-auto=update metadata-introspection path entirely.
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
